version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     fincruise
      POSTGRES_PASSWORD: fincruise_secret
      POSTGRES_DB:       fincruise_settlement
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fincruise -d fincruise_settlement']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Prisma migrate ──────────────────────────────────────────────────────────
  # Runs once on startup to apply migrations, then exits
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://fincruise:fincruise_secret@db:5432/fincruise_settlement
    depends_on:
      db:
        condition: service_healthy

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://fincruise:fincruise_secret@db:5432/fincruise_settlement
      REDIS_URL:    redis://redis:6379
      PORT:         4000
    volumes:
      # Mount your Fireblocks private key (never bake into image)
      - ./fireblocks_secret.key:/app/fireblocks_secret.key:ro
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
