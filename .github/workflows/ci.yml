name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, test, migrate
    runs-on: ubuntu-latest

    # A real Postgres rather than mocks: the settlement engine's correctness
    # claims are about transactions and constraints, and neither survives being
    # mocked. The idempotency guarantee in particular IS a unique constraint —
    # testing it without a database tests nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axlink
          POSTGRES_PASSWORD: axlink
          POSTGRES_DB: axlink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U axlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://axlink:axlink@localhost:5432/axlink_test
      API_BASE_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: |
          if [ -d prisma/migrations ]; then
            npx prisma migrate deploy
          else
            echo "::error::prisma/migrations/ is missing."
            echo "::error::'prisma migrate deploy' does nothing without it, so a deploy would"
            echo "::error::silently succeed against an unmigrated database."
            echo "::error::Run ./scripts/create-baseline-migration.sh and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Settlement harness
        # Drives real settlements through the engine against stubbed rails and
        # asserts the ledger invariants after each. See docs/SIMULATOR.md.
        run: npm run simulate
        env:
          SIMULATOR_ENABLED: 'true'

      - name: Verify the production image builds
        run: docker build -t axlink-settlement:ci .

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
