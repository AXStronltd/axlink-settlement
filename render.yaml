services:
  - type: web
    name: axlink-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: axlink-db
          property: connectionString
      - key: OPS_API_KEY
        generateValue: true
      - key: DEMO_ENABLED
        value: true
      - key: SIMULATOR_ENABLED
        value: false
      - key: OUTBOUND_SETTLEMENT_ENABLED
        value: false
      - key: B2BINPAY_SANDBOX
        value: true
      - key: FIREBLOCKS_SANDBOX
        value: true
      - key: LOG_LEVEL
        value: info
      - key: SETTLEMENT_WORKER_ENABLED
        value: true
      - key: OUTBOX_WORKER_ENABLED
        value: true

  - type: web
    name: axlink-ops
    runtime: static
    buildCommand: echo done
    staticPublishPath: apps/marketing
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  - name: axlink-db
    plan: free
    databaseName: axlink_settlement
    postgresMajorVersion: 16
