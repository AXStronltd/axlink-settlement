services:
  - type: web
    name: axlink-api   # Render service name (its URL is axlink-settlement.onrender.com); must match or a sync creates a duplicate
    runtime: docker
    region: frankfurt
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: axlink-db
          property: connectionString
      - key: OPS_API_KEY
        generateValue: true
      # Production guards (packages/shared/config.ts) refuse to boot with demo/simulator on.
      - key: DEMO_ENABLED
        value: false
      - key: SIMULATOR_ENABLED
        value: false
      # PRODUCTION-environment outbound stays off until the owner turns it on for go-live.
      # (SANDBOX-environment institutions settle regardless.)
      - key: OUTBOUND_SETTLEMENT_ENABLED
        value: false
      # ── Set in the Render dashboard, never in git (sync: false) ─────────────────────────
      # Sandbox phase: FIREBLOCKS_SANDBOX=true, SOLANA_CLUSTER=devnet, a dedicated devnet RPC,
      #                FIREBLOCKS_USDC_ASSET = the workspace's devnet USDC id (npm run fb:preflight).
      # Live phase:    FIREBLOCKS_SANDBOX=false, SOLANA_CLUSTER=mainnet, a dedicated mainnet RPC,
      #                fresh live API key + signing key; unset FIREBLOCKS_USDC_ASSET.
      # The app refuses to start if workspace and cluster disagree.
      - key: FIREBLOCKS_SANDBOX
        sync: false
      - key: SOLANA_CLUSTER
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: FIREBLOCKS_API_KEY
        sync: false
      - key: FIREBLOCKS_SECRET_KEY_B64          # base64 of the API user's private key; written to a 0600 file at boot
        sync: false
      - key: FIREBLOCKS_WORKSPACE_ID
        sync: false
      - key: FIREBLOCKS_WEBHOOK_JWKS_URL        # sandbox: https://sandbox-keys.fireblocks.io/.well-known/jwks.json · live US: https://keys.fireblocks.io/.well-known/jwks.json
        sync: false
      - key: FIREBLOCKS_USDC_ASSET
        sync: false
      - key: FIREBLOCKS_TREASURY_VAULT
        sync: false
      - key: WEBHOOK_ENCRYPTION_KEY             # AES-256-GCM key for institution webhook secrets
        sync: false
      - key: API_KEY_PEPPER                     # pepper for institution API key hashes; never change after go-live
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SETTLEMENT_WORKER_ENABLED
        value: true
      - key: OUTBOX_WORKER_ENABLED
        value: true

  - type: web
    name: axlink-web
    runtime: static
    buildCommand: echo done
    staticPublishPath: apps/marketing
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: axlink-ops
    runtime: static
    buildCommand: cd apps/web/ops && npm install && npm run build
    staticPublishPath: apps/web/ops/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    # The dashboard calls /api on its own origin (apps/web/ops/src/api.ts, BASE = '/api'); it does not
    # read VITE_API_URL. Order matters: the API proxy must come before the SPA fallback.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://axlink-settlement.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Must match the existing database exactly: plan, major version, database name and region cannot be
  # changed by a sync (Render refuses a downgrade instead of applying it).
  - name: axlink-db
    plan: basic-256mb
    region: frankfurt
    databaseName: axlink_db
    postgresMajorVersion: "18"
