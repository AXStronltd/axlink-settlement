services:
  - type: web
    name: axlink-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: axlink-db
          property: connectionString
      - key: OPS_API_KEY
        generateValue: true
      - key: DEMO_ENABLED
        value: true
      - key: SIMULATOR_ENABLED
        value: false
      - key: OUTBOUND_SETTLEMENT_ENABLED
        value: false
      - key: B2BINPAY_SANDBOX
        value: true
      - key: FIREBLOCKS_SANDBOX
        value: true
      - key: LOG_LEVEL
        value: info
      - key: SETTLEMENT_WORKER_ENABLED
        value: true
      - key: OUTBOX_WORKER_ENABLED
        value: true

  - type: web
    name: axlink-web
    runtime: static
    buildCommand: echo "static"
    staticPublishPath: apps/web
    plan: starter
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: axlink-ops
    runtime: static
    buildCommand: npm install && npm run build
    rootDir: apps/web/ops
    staticPublishPath: apps/web/ops/dist
    plan: starter
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: axlink-api
          type: web
          property: host

databases:
  - name: axlink-db
    plan: free
    databaseName: axlink_settlement
    postgresMajorVersion: 16
